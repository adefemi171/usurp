name: usurp-data
services:
  postgres:
    image: ${USURP_POSTGRES_IMAGE:?Set a verified PostgreSQL 17 image digest}
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    shm_size: 128mb
    environment:
      POSTGRES_USER: usurp_admin
      POSTGRES_DB: usurp
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C --auth-host=scram-sha-256
    secrets:
      - admin_password
      - app_password
    ports:
      # Preparation default: SSH access only. Public bind requires verified
      # TLS, Docker-aware firewall, provider firewall, and cutover approval.
      - "${USURP_DB_BIND:-127.0.0.1}:15433:5432"
    volumes:
      - data:/var/lib/postgresql/data
      - ./tls:/etc/usurp-tls:ro
      - ./pg_hba.conf:/etc/usurp/pg_hba.conf:ro
      - ./init.sh:/docker-entrypoint-initdb.d/10-usurp.sh:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/usurp-tls/fullchain.pem
      - -c
      - ssl_key_file=/etc/usurp-tls/privkey.pem
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/usurp/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U usurp_admin -d usurp -q"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
secrets:
  admin_password:
    file: ./secrets/admin-password
  app_password:
    file: ./secrets/app-password
volumes:
  data:
