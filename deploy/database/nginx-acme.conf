# HTTP serves certificate challenges only; the web app remains on Render.
server {
    listen 80;
    server_name usurp.fi-techconsulting.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/usurp-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
