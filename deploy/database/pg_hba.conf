# Unix socket administration is accessible only inside this isolated container.
local all usurp_admin trust
local all all reject
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
# Host firewall restricts sources; this independently restricts DB and role.
hostssl usurp usurp 0.0.0.0/0 scram-sha-256
hostssl usurp_rehearsal usurp 0.0.0.0/0 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
